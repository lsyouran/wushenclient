# Gradle 守护进程的内存上限（CI 的 7G 机器够用；默认 512m 在 Compose + KSP 下会 OOM）
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# 并行构建：三个模块互不依赖对方的产出（:app 依赖 :core/:protocol 的 jar），可以并行
org.gradle.parallel=true

# 构建缓存：CI 里配 setup-gradle 的 cache 才真的省时间；本地无所谓
org.gradle.caching=true

# ★ 不自动下载 JDK：CI 用 setup-java 提供 JDK 17。
#   自动下载需要额外的 toolchain resolver 插件，缺了它会在**第一次构建**时才报错，
#   而报错信息指向"没有找到 JDK 17"，看不出是少了插件。宁可让它老实失败。
org.gradle.java.installations.auto-download=false

# AndroidX（Compose 必需）
android.useAndroidX=true
# 不用 Jetifier：本项目没有老 support-library 依赖，开了只是拖慢构建
android.enableJetifier=false

kotlin.code.style=official
