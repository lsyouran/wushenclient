# 安卓端构建与验证（26 册 §83.5）。
#
# ★★ 存在理由：开发机**没有 JDK、没有 Android SDK**（`JAVA_HOME` 指向一个不存在的目录），
#   所以"能压缩一行 Kotlin"这件事只能由 CI 提供。
#   ⇒ 这个 workflow 不只是打包，它还承担了**本机做不到的全部验证**：
#     编译、单测、以及"生成物有没有落后于协议"。
#
# ★ 三条作业的分工就是三种失败：
#   ① protocol-drift —— Kotlin 协议模型落后于 `shared/protocol.ts`（生成器 `--check`，秒级）
#   ② jvm-tests      —— 判断逻辑错了（`:core` 与 `:protocol` 的单测，**不需要安卓 SDK**）
#   ③ assemble       —— 代码编不过 / 清单写错（真出 debug APK，可下载装机）
#
# ⚠️ 本目录在**仓库根**（git 根是 `ts-mud/`，`newmud/` 是子目录），
#   所以下面每一条路径都带 `newmud/` 前缀。若把 `newmud` 拆成独立仓库，
#   这个文件要搬到 `newmud/.github/workflows/`，并把所有 `newmud/` 前缀去掉。

name: Android

on:
  push:
    paths:
      - 'newmud/android/**'
      - 'newmud/shared/protocol.ts'
      - 'newmud/tools/gen-kotlin-protocol.mjs'
      - '.github/workflows/android.yml'
      # 诊断脚本改了也要重跑：它决定"失败时你能不能看到原因"
      - '.github/ci-diagnose.py'
  pull_request:
    paths:
      - 'newmud/android/**'
      - 'newmud/shared/protocol.ts'
      - 'newmud/tools/gen-kotlin-protocol.mjs'
      - '.github/workflows/android.yml'
      - '.github/ci-diagnose.py'
  workflow_dispatch:

# 同一分支连续推两次：取消前一次。省时间，也避免"两个作业同时写同一个 artifact"
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与本地托管版本对齐（`C:\Users\...\node\versions\22.22.2-6`）
  NODE_VERSION: '22.22.2'
  GRADLE_VERSION: '8.11.1'
  JAVA_VERSION: '17'

jobs:
  # ── ① 生成物 vs 协议：谁落后就红 ──────────────────────────────────────────
  #
  # ★ 这条**不需要 JDK**，所以放在最前面：最快给出"你忘了重新生成"的答案。
  #   它守的是"协议改了、Kotlin 没跟上"——那种错误在安卓编译时**表现为完全正常的代码**，
  #   只会在真机上少一个字段（`ignoreUnknownKeys` 把多出来的丢掉、缺的走默认值）。
  protocol-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: newmud/package-lock.json

      - name: 安装依赖
        working-directory: newmud
        run: npm ci

      - name: 校验 Kotlin 协议模型是否与 shared/protocol.ts 一致
        working-directory: newmud
        run: node tools/gen-kotlin-protocol.mjs --check

      - name: 打印真机样本覆盖面（缺口必须是有解释的）
        working-directory: newmud
        run: node tools/gen-protocol-fixtures.mjs --list

  # ── ② 判断逻辑的单测：**不需要安卓 SDK** ──────────────────────────────────
  #
  # ★ `-PskipApp` 是这里的关键：不配置 `:app` 就不会触发 AGP 的 "SDK location not found"。
  #   于是"文本该落到哪儿""颜色标签怎么解""面板轮次"这些**唯一会写错的判断**
  #   可以在一台没有安卓环境的机器上几秒内验完。
  jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          # ★ 仓库里**没有** `gradle-wrapper.jar`（二进制文件不进版本库），
          #   由这个 action 提供 Gradle 本体。于是本地也不需要先装 wrapper 才能出包。
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ★★ 为什么要拆成两个 step：`:protocol:test` 一红，`:core:test` 就根本不会被调度，
      #   于是一次 CI 只能拿到一半信息（老版本就是这样：改了 protocol 的 bug，core 的
      #   bug 要等下一轮才看到）。`continue-on-error` 让两个都跑完，再在下一步汇总定去留。
      - name: ':protocol 解码测试'
        id: protocol_test
        continue-on-error: true
        working-directory: newmud/android
        # `set -o pipefail`：不加的话 `| tee` 会让退出码变成 tee 的 0，**红的构建看成绿的**
        run: |
          set -o pipefail
          gradle :protocol:test -PskipApp --stacktrace 2>&1 | tee "$RUNNER_TEMP/protocol.log"

      - name: ':core 判断测试'
        id: core_test
        continue-on-error: true
        working-directory: newmud/android
        run: |
          set -o pipefail
          gradle :core:test -PskipApp --stacktrace 2>&1 | tee "$RUNNER_TEMP/core.log"

      - name: 汇总两个测试的结论（任何一个红就红）
        run: |
          echo "protocol=${{ steps.protocol_test.outcome }} core=${{ steps.core_test.outcome }}"
          if [ "${{ steps.protocol_test.outcome }}" != "success" ] || [ "${{ steps.core_test.outcome }}" != "success" ]; then
            exit 1
          fi

      # ★★ 取证通道为什么是**注解**，不是日志、也不是 summary：
      #   ① 原始日志：匿名 `GET /actions/runs/{id}/logs` 是 **403**，只有仓库 owner 能拿；
      #   ② step summary：无条数限制，但 run 页面是 JS 渲染的 ⇒ `curl` 抓 HTML **拿不到正文**
      #      （实测只抓到作业卡片，没有 summary 文字）；
      #   ③ 注解：`commits/{sha}/check-runs` → `annotations_url`，**匿名 HTTP 就能读到正文**。
      #   代价是每步最多 10 条 ⇒ 挑最值钱的（失败用例 > 编译错 > What went wrong > 尾部）。
      #   ⚠️ 跑诊断的 shell 是 `bash -eo pipefail`：脚本里任何 `grep` 没匹配就会把整步打断。
      #      所以这里交给 `ci-diagnose.py`（它自己吞掉所有异常、永远 exit 0），**不要再在 YAML 里
      #      拼 grep** —— 上一版就在这一步翻车：诊断步骤 0 秒退出，失败时什么都看不到。
      - name: 失败诊断（注解 + summary，匿名可读）
        if: failure()
        run: |
          python3 .github/ci-diagnose.py "$RUNNER_TEMP/protocol.log" "$RUNNER_TEMP/core.log"

      - name: 失败时把构建日志传上来
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-jvm-tests
          path: |
            ${{ runner.temp }}/protocol.log
            ${{ runner.temp }}/core.log
          if-no-files-found: ignore

      - name: 失败时把测试报告传上来
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: |
            newmud/android/protocol/build/reports/tests/**
            newmud/android/core/build/reports/tests/**
          if-no-files-found: ignore

  # ── ③ 出 APK：这一步才需要安卓 SDK ────────────────────────────────────────
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: 构建 debug APK
        working-directory: newmud/android
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      # 同一套取证逻辑（见上面 jvm-tests 的注释：注解是唯一匿名可读的通道）
      - name: 失败诊断（注解 + summary，匿名可读）
        if: failure()
        run: |
          python3 .github/ci-diagnose.py "$RUNNER_TEMP/build.log"

      - name: 失败时把构建日志传上来
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-assemble
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: newmud-debug-apk
          path: newmud/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
